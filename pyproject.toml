[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opentaskpy"
version = "v26.28.0"
authors = [{ name = "Adam McDonagh", email = "adam@elitemonkey.net" }]
license-files = [ "LICENSE" ]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
]
keywords = [
    "automation",
    "task",
    "framework",
    "scheduling",
    "ssh",
    "sftp",
    "remote",
    "execution",
    "command",
]
dependencies = [
    "jinja2 >= 3.1",
    "jsonpath-ng >= 1.8",
    "jsonschema >= 4.26",
    "paramiko >= 4.0",
    "requests >= 2.33",
    "referencing >= 0.37",
    "tenacity >= 9.1",
    "python-gnupg >= 0.5.6",
    "omegaconf >= 2.3.0",
]
description = "A framework for automation execution of commands and transferring files between hosts"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "types-requests >=2.28",
    "types-paramiko >=3.0",
    "black == 26.5.1",
    "psutil >= 5.9",
    "isort",
    "pytest",
    "bumpver",
    "pytest-shell",
    "lovely-pytest-docker",
    "pre-commit",
    "pylint >= 4.0",
    "pydantic",
    "mypy",
    "ruff",
    "coverage",
    "pytest-cov",
    "freezegun",
]

[project.urls]
"Homepage" = "https://github.com/adammcdonagh/open-task-framework"
"Bug Tracker" = "https://github.com/adammcdonagh/open-task-framework/issues"
"Changelog" = "https://github.com/adammcdonagh/open-task-framework/blob/main/CHANGELOG.md"

[project.scripts]
task-run = "opentaskpy.cli.task_run:main"
otf-batch-validator = "opentaskpy.cli.batch_validator:main"

[tool.isort]
profile = 'black'

[tool.bumpver]
current_version = "v26.28.0"
version_pattern = "vYY.WW.PATCH[-TAG]"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"', 'version = "{version}"']

# Include the schema JSON files in the package
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint.BASIC]
ignore = ["tests"]

load-plugins = ["pylint.extensions.code_style", "pylint.extensions.typing"]

class-const-naming-style = "any"

good-names = ["id", "_", "ip", "rc", "ex"]

[tool.pylint."MESSAGES CONTROL"]
# Reasons disabled:
# format - handled by black
# locally-disabled - it spams too much
# duplicate-code - unavoidable
# cyclic-import - doesn't test if both import on load
# abstract-class-little-used - prevents from setting right foundation
# too-many-* - are not enforced for the sake of readability
# too-few-* - same as too-many-*
# abstract-method - with intro of async there are always methods missing
# inconsistent-return-statements - doesn't handle raise
# too-many-ancestors - it's too strict.
# wrong-import-order - isort guards this
# consider-using-f-string - str.format sometimes more readable
# ---
# Pylint CodeStyle plugin
# consider-using-namedtuple-or-dataclass - too opinionated
# consider-using-assignment-expr - decision to use := better left to devs
disable = [
    "format",
    "abstract-method",
    "cyclic-import",
    "duplicate-code",
    "inconsistent-return-statements",
    "locally-disabled",
    "not-context-manager",
    "too-few-public-methods",
    "too-many-ancestors",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
